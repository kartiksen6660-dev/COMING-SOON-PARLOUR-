<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | LuxLooks</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<header class="site-header">
    <a class="logo" href="index.html">LUX<span>LOOKS</span></a>
    <button class="menu-toggle" aria-label="Open navigation">☰</button>

    <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a class="active" href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>
    <section class="page-banner">
        <p class="eyebrow">THE LOOKBOOK</p>
        <h1>Style Gallery</h1>
        <p>Explore hairstyle inspiration and salon interiors.</p>
    </section>

    <section class="section container">
        <div class="gallery-grid">

            <figure class="gallery-card">
                <img src="https://images.unsplash.com/photo-1580618672591-eb180b1a973f?auto=format&fit=crop&w=800&q=85"
                     alt="Hair styling inspiration">
                <figcaption>Classic Cut</figcaption>
            </figure>

            <figure class="gallery-card">
                <img src="https://images.unsplash.com/photo-1595476108010-b4d1f102b1b1?auto=format&fit=crop&w=800&q=85"
                     alt="Modern hairstyle">
                <figcaption>Modern Texture</figcaption>
            </figure>

            <figure class="gallery-card">
                <img src="https://images.unsplash.com/photo-1560869713-7d0a29430803?auto=format&fit=crop&w=800&q=85"
                     alt="Hair colour inspiration">
                <figcaption>Colour & Shine</figcaption>
            </figure>

            <figure class="gallery-card">
                <img src="https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=800&q=85"
                     alt="Layered hairstyle">
                <figcaption>Soft Layers</figcaption>
            </figure>

            <figure class="gallery-card">
                <img src="https://images.unsplash.com/photo-1519699047748-de8e457a634e?auto=format&fit=crop&w=800&q=85"
                     alt="Occasion hairstyle">
                <figcaption>Event Styling</figcaption>
            </figure>

            <figure class="gallery-card">
                <img src="https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?auto=format&fit=crop&w=800&q=85"
                     alt="Salon interior">
                <figcaption>Salon Experience</figcaption>
            </figure>

        </div>
    </section>

    <section class="section soft-section">
        <div class="container">
            <div class="section-heading">
                <p class="eyebrow">MEDIA CORNER</p>
                <h2>Video & Audio</h2>
            </div>

            <div class="media-grid">
                <div class="media-card">
                    <h3>Salon Video</h3>

                    <video controls preload="metadata"
                           poster="https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?auto=format&fit=crop&w=1000&q=80">
                        <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"
                                type="video/mp4">
                        Your browser does not support video.
                    </video>

                    <p class="small-note">
                        Video ke liye internet connection chahiye.
                    </p>
                </div>

                <div class="media-card">
                    <h3>Salon Audio</h3>
                    
                    <p class="small-note">
                        Audio file isi folder mein rakho.
                    </p>
                </div>
            </div>
        </div>
    </section>
</main>

<footer class="site-footer">
    <a class="logo" href="index.html">LUX<span>LOOKS</span></a>
    <p>Luxury Unisex Salon | © <span id="year"></span></p>
</footer> 
</section>

</html>
